<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Кеша</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="reactor.css">
</head>
<body>
<div class="edge edge-top"    id="edge-app"></div>
<div class="edge edge-right"  id="edge-alice"></div>
<div class="edge edge-bottom" id="edge-website"></div>
<div class="edge edge-left"   id="edge-telegram"></div>

<div class="app">
  <aside class="panel panel-left">
    <h2 class="panel-title">Диалоговое окно</h2>
    <div class="chat-messages" id="chatMessages">
      <div class="message bot" data-source="app">Привет! Я Кеша. Слушаю.</div>
    </div>
    <div class="chat-input">
      <input type="text" id="commandInput" placeholder="Введите команду...">
      <button onclick="sendFromInput()">→</button>
    </div>
  </aside>

  <main class="panel panel-center">
    <h1 class="main-title">Голосовой<br>помощник Кеша</h1>
    <div class="reactor" id="reactor">
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btnListen" onclick="toggleListening()" title="Ctrl+Space">СЛУШАТЬ</button>
      <button class="ctrl-btn" id="btnSilent" onclick="toggleSilent()" title="Тихий режим: только текст">ГОЛОС ВКЛ</button>
      <button class="ctrl-btn" id="btnTheme" onclick="toggleTheme()" title="Тема оформления">СВЕТЛАЯ</button>
      <button class="ctrl-btn" id="btnReactor" onclick="openReactorEditor()" title="Цвета и анимации реактора">РЕАКТОР</button>
    </div>
    <div class="status-bar" id="statusBar">ЖДУ</div>
  </main>

  <aside class="panel panel-right">
    <h2 class="panel-title">Команды</h2>
    <div class="search-box">
      <input type="text" id="cmdSearch" placeholder="Поиск команды...">
      <span class="search-icon">&#128269;</span>
    </div>
    <div class="commands-scroll" id="commandsScroll"></div>
  </aside>
</div>

<script src="qwebchannel.js"></script>
<script src="reactor_config.js"></script>
<script src="reactor.js"></script>
<script src="script.js"></script>
</body>
</html>
