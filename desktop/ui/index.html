<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Кеша</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="reactor.css">
</head>
<body>
<div class="edge edge-top"    id="edge-app"></div>
<div class="edge edge-right"  id="edge-alice"></div>
<div class="edge edge-bottom" id="edge-website"></div>
<div class="edge edge-left"   id="edge-telegram"></div>

<div class="app">
  <aside class="panel panel-left">
    <h2 class="panel-title">Диалоговое окно</h2>
    <div class="chat-messages" id="chatMessages">
      <div class="message bot" data-source="app">Привет! Я Кеша. Слушаю.</div>
    </div>
    <div class="chat-input">
      <input type="text" id="commandInput" placeholder="Введите команду...">
      <button onclick="sendFromInput()">→</button>
    </div>
  </aside>

  <main class="panel panel-center">
    <h1 class="main-title">Голосовой<br>помощник Кеша</h1>
    <div class="reactor" id="reactor">
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btnFloat" onclick="toggleFloat()" title="Скрыть / показать маленький летающий реактор">СКРЫТЬ</button>
      <button class="ctrl-btn" id="btnMic" onclick="toggleMic()" title="Микрофон включён (нажми — Кеша перестанет слышать)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/><line class="mic-slash" x1="3" y1="3" x2="21" y2="21" stroke="#FF2840" stroke-width="2.6"/></svg>
      </button>
      <button class="ctrl-btn" id="btnSilent" onclick="toggleSilent()" title="Звук включён (нажми — тихий режим: Кеша молча выполняет команды)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3,9 7,9 12,5 12,19 7,15 3,15"/><path class="spk-wave" d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/><line class="mic-slash" x1="3" y1="3" x2="21" y2="21" stroke="#FF2840" stroke-width="2.6"/></svg>
      </button>
      <button class="ctrl-btn" id="btnDesign" onclick="openDesign()" title="Сайт-студия: дизайн интерфейса и реактор">ДИЗАЙН</button>
    </div>
    <div class="status-bar" id="statusBar">ЖДУ</div>
  </main>

  <aside class="panel panel-right">
    <h2 class="panel-title">Команды</h2>
    <div class="search-box">
      <input type="text" id="cmdSearch" placeholder="Поиск команды...">
      <span class="search-icon">&#128269;</span>
    </div>
    <div class="commands-scroll" id="commandsScroll"></div>
  </aside>
</div>

<script src="qwebchannel.js"></script>
<script src="reactor_config.js"></script>
<script src="reactor.js"></script>
<script src="design.js"></script>
<script src="script.js"></script>
</body>
</html>
